[project]
name = "kinodraw"
version = "0.3.0"
description = "Turn any script into a hand-drawn whiteboard explainer video, locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.20",
    "misaki[zh]>=0.9.4",
    "fastembed>=0.8.1",
    "jieba>=0.42.1",
    "num2words>=0.5.14",
    "cn2an>=0.5.24",
    "pillow>=11",
    "numpy>=2",
    "scipy>=1.14",
    "resvg-py>=0.5.0",
    "svgelements>=1.9.6",
    "fonttools>=4.50",
    "imageio-ffmpeg>=0.6.0",
    "platformdirs>=4",
    "certifi>=2024.8.30",
    "defusedxml>=0.7.1",
    "pywebview>=6",
    "keyring>=25",
    "openai>=3",
    "anthropic>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kinodraw = "kinodraw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kinodraw"]

[tool.pytest.ini_options]
# Windows reads and writes text as cp1252 unless told otherwise, so KinoDraw names utf-8 everywhere; run
# `python -X warn_default_encoding -W error::EncodingWarning -m pytest` to find any place that doesn't. The packages
# below are other people's code and leave it out only on plain-ASCII files (os.devnull; the embedding models' JSON,
# pinned by sha256 in kinodraw/director/match.py), so they don't fail that run.
filterwarnings = [
    "ignore::EncodingWarning:imageio_ffmpeg",
    "ignore::EncodingWarning:fastembed",
]
