name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache voice and embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kinodraw-models
          key: models-v1-${{ runner.os }}
      - name: Unit tests
        env:
          KINODRAW_MODELS: ~/.cache/kinodraw-models
        run: pytest -q
      - name: Smoke video (a 20-second script, offline director)
        env:
          KINODRAW_MODELS: ~/.cache/kinodraw-models
        run: |
          kinodraw setup --lang en
          kinodraw make tests/fixtures/tiny.md -o smoke --workers 1
      - name: Signing smoke (a throwaway identity signs a stub app, so the release signing step keeps working)
        if: runner.os == 'macOS'
        run: |
          cd "$RUNNER_TEMP"
          printf '[req]\ndistinguished_name=dn\nx509_extensions=v3\nprompt=no\n[dn]\nCN=CI Smoke Signing\n[v3]\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=critical,codeSigning\n' > cs.cnf
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes -config cs.cnf -keyout k.pem -out c.pem
          openssl pkcs12 -export -inkey k.pem -in c.pem -out s.p12 -passout pass:smoke -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          mkdir -p Stub.app/Contents/MacOS && cp /bin/echo Stub.app/Contents/MacOS/Stub
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.github.kinodraw.smoke</string><key>CFBundleExecutable</key><string>Stub</string></dict></plist>\n' > Stub.app/Contents/Info.plist
          MACOS_SIGN_P12="$(base64 -i s.p12)" MACOS_SIGN_P12_PASSWORD=smoke "$GITHUB_WORKSPACE/packaging/sign-macos.sh" Stub.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            smoke/*.mp4
            smoke/build/qa.json
            smoke/build/contact-sheet.jpg

  classroom-extension:          # the Chrome Web Store package, ready to download from the run's Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edu/package-lock.json
      - name: Install
        run: |
          pip install -e .
          cd edu && npm ci
      - name: Build the store package
        working-directory: edu
        env:
          PYTHON: python
        run: node tools/build.mjs --zip
      - name: Unit and parity tests
        working-directory: edu
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: kinodraw-classroom
          path: edu/dist/*.zip

  installers:          # every push builds and runs the packaged apps; only a v* tag archives and publishes them
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: write          # attach the installers to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -e . pyinstaller
          pyinstaller packaging/kinodraw.spec --noconfirm
      - name: Sign the Mac app (stable identity from the repository secrets)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: packaging/sign-macos.sh "dist/KinoDraw.app"
      - name: Archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../KinoDraw-${{ github.ref_name }}-windows.zip" "KinoDraw"; \
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent "KinoDraw.app" "../KinoDraw-${{ github.ref_name }}-macos.zip"; \
          else tar czf "../KinoDraw-${{ github.ref_name }}-linux.tar.gz" "KinoDraw"; fi
      - name: Smoke test the app the way a fresh computer runs it (no system certificates, no voice yet), download the voice and make a short video
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 25
        env:
          SSL_CERT_FILE: /nonexistent          # v0.1.4's Mac app failed every download and sign-in here
          SSL_CERT_DIR: /nonexistent
          KINODRAW_MODELS: ${{ runner.temp }}/models
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then app="dist/KinoDraw.app/Contents/MacOS/KinoDraw"; else app="dist/KinoDraw/KinoDraw"; fi
          "$app" setup --lang en
          "$app" make tests/fixtures/tiny.md -o smoke --workers 1
          python scripts/check_smoke_video.py smoke
      - name: Smoke test the Windows app (the same, through a windowed exe that prints nothing and that a shell does not wait for)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 25          # a crash of the windowed exe can pop up a dialog nobody can click; this ends the run
        env:
          SSL_CERT_FILE: /nonexistent          # no effect here: Windows Python reads the Windows certificate store, not these
          SSL_CERT_DIR: /nonexistent
          KINODRAW_MODELS: ${{ runner.temp }}\models
        run: |
          $app = Join-Path $PWD 'dist\KinoDraw\KinoDraw.exe'
          function Invoke-KinoDraw([string[]]$AppArgs) {
            $out = Join-Path $env:RUNNER_TEMP 'kinodraw-out.txt'
            $err = Join-Path $env:RUNNER_TEMP 'kinodraw-err.txt'
            $run = Start-Process -FilePath $app -ArgumentList $AppArgs -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            Get-Content $out, $err | Write-Host
            if ($run.ExitCode -ne 0) { throw "KinoDraw $AppArgs exited with code $($run.ExitCode)" }
          }
          Invoke-KinoDraw 'setup', '--lang', 'en'
          Invoke-KinoDraw 'make', 'tests/fixtures/tiny.md', '-o', 'smoke', '--workers', '1'
          python scripts/check_smoke_video.py smoke
          if ($LASTEXITCODE -ne 0) { throw "check_smoke_video.py exited with code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: |
            smoke/*.mp4
            smoke/build/qa.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: KinoDraw-*
