<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KinoDraw</title>
<link rel="stylesheet" href="/static/style.css">
<script>window.STUDIO_TOKEN = '__STUDIO_TOKEN__';</script>
<script src="/static/app.js" defer></script>
</head>
<body>
<aside id="side">
  <div class="brand">Kino<span>Draw</span></div>
  <button id="btn-new" class="primary wide">+ New video</button>
  <label class="file">Import project ZIP… <input id="project-import" type="file" accept=".zip,application/zip"></label>
  <button id="btn-trash">Trash</button><button id="btn-sample" class="ghost wide">Watch an example</button>
  <div class="side-label">Your videos</div>
  <nav id="projects"></nav>
  <button id="btn-settings" class="ghost wide">Settings</button>
  <button id="feedback" type="button">Feedback or a problem? Tell us</button>
</aside>
<main id="main"></main>

<template id="tpl-sample">
  <section class="page">
    <h1>Here's a video KinoDraw made</h1>
    <p class="muted">It was made from a short script about why the sky is blue: KinoDraw chose the doodles, drew
      them and narrated every line, with captions and chapters. Paste your own script to make one like it.</p>
    <video controls disableremoteplayback preload="metadata" poster="/static/sample/why-is-the-sky-blue.jpg"
      src="/static/sample/why-is-the-sky-blue.mp4"></video>
    <button id="s-make" class="primary big">Make your own video</button>
    <p class="muted">No account needed. Your first video downloads the voice and the doodle search once
      (about 260 MB for English).</p>
  </section>
</template>

<template id="tpl-new">
  <section class="page">
    <h1>New video</h1>
    <p class="muted">Paste a script (or choose a .md, .txt or .docx file). Headings become sections;
      numbers, quotes and definitions become charts and notes automatically.</p>
    <div id="starter-wrap" class="hidden"><div class="side-label">Start from an example</div>
      <div id="starters" class="starters" role="group" aria-label="Start from an example"></div></div>
    <textarea id="script" placeholder="# My topic&#10;&#10;An opening paragraph…&#10;&#10;## First idea&#10;…"></textarea>
    <div class="row">
      <label class="file">Choose file… <input id="file" type="file" accept=".md,.txt,.docx"></label>
      <span id="file-name" class="muted"></span>
    </div>
    <details>
      <summary>Draft a script from source notes (optional)</summary>
      <label>Topic <input id="writer-topic" maxlength="1000" placeholder="What the script is about"></label>
      <label>Source notes (required to draft; one note per line)<textarea id="writer-notes" maxlength="30000" placeholder="Paste the facts the draft may use"></textarea></label>
      <label>Local voice/style guidance (optional)<textarea id="writer-voice" maxlength="5000" placeholder="For example: short sentences, plain language"></textarea></label>
      <p id="writer-note" class="note"></p>
      <button id="writer-draft" type="button">Draft from notes</button>
      <p id="writer-status" class="muted" role="status" aria-live="polite"></p>
      <div id="writer-review" class="hidden">
        <label>Returned draft — review before replacing your script<textarea id="writer-text"></textarea></label>
        <button id="writer-use" type="button">Replace script with this draft</button>
        <button id="writer-dismiss" type="button" class="ghost">Keep my script</button>
      </div>
    </details>
    <div class="narrator-pick">
      <span class="pick-label">Narrator</span>
      <label class="seg"><input type="radio" name="narrator" value="builtin" checked><b id="nv-ai-title">Built-in voice</b>
        <small id="nv-ai-note">A natural AI voice reads your script</small></label>
      <label class="seg"><input type="radio" name="narrator" value="own"><b>My own voice</b>
        <small>You read the script aloud; every drawing follows your voice</small></label>
    </div>
    <div class="grid">
      <label>Title <input id="title" placeholder="from the script"></label>
      <label>Language <select id="lang"><option value="">Detect</option><option value="en">English</option><option value="es">Español</option><option value="zh">中文</option></select></label>
      <div id="voice-wrap">
        <label id="voice-label" for="voice">Voice</label><div class="row"><select id="voice"></select>
          <input id="server-voice" class="hidden" maxlength="80">
          <button id="voice-play" type="button" class="ghost" aria-label="Play a sample of this voice">▶ Hear it</button></div>
        <select id="server-voice-pick" class="hidden" aria-label="Voices your server lists"></select>
        <div id="server-voice-note" class="muted"></div>
        <div id="speed-wrap"></div>
      </div>
      <label>Director <select id="director"></select></label>
      <label><input id="director-v3" type="checkbox" checked> Whole-story director v3 — chooses cast, treatments and style. Uncheck for legacy/manual whiteboard.</label>
      <label>Style <select id="style"></select></label>
      <label>Format <select id="format"></select></label>
      <label id="motion-wrap" class="hidden">Motion <select id="motion"><option value="calm">Calm</option><option value="lively" selected>Lively</option>
        <option value="showreel">Showreel</option></select></label>
    </div>
    <p id="style-note" class="note hidden"></p>
    <div id="brand" class="grid hidden">
      <label>Product name <input id="brand-name" placeholder="from the script"></label>
      <label>Website <input id="brand-url" placeholder="example.com"></label>
      <label>Button text <input id="brand-cta" placeholder="Try it for free"></label>
    </div>
    <div id="byo" class="grid hidden">
      <label>Model <input id="model" placeholder="default"></label>
      <label id="base-wrap" class="hidden">Base URL <input id="base-url" placeholder="https://…/v1"></label>
    </div>
    <p id="director-note" class="note"></p>
    <button id="create" class="primary big">Create storyboard</button>
  </section>
</template>

<template id="tpl-project">
  <section class="page">
    <header class="project-head">
      <div><h1 id="p-title"></h1><div id="p-meta" class="muted"></div><div id="p-style" class="muted hidden"></div></div>
      <div class="actions">
        <select id="p-director"></select>
        <select id="p-format" aria-label="Format"></select>
        <select id="p-native-target" aria-label="Make and export resolution">
          <option value="">Saved resolution</option>
          <option value="16:9,1920,1080">Landscape 1080p</option>
          <option value="16:9,3840,2160">Landscape 4K</option>
          <option value="1:1,1080,1080">Square 1080</option>
          <option value="9:16,1080,1920">Portrait 1080</option>
        </select>
        <select id="p-export-format" aria-label="Export file format"><option value="webm">WebM with audio</option><option value="gif">GIF + audio companion</option></select>
        <button id="p-redirect" class="ghost">Re-plan visuals</button>
        <button id="p-reveal" class="ghost">Open folder</button>
        <label class="check"><input id="p-credit" type="checkbox" checked><span></span></label>
        <button id="p-export" class="ghost hidden">Export</button><button id="p-projectzip" class="ghost hidden">Project ZIP</button><button id="p-make" class="primary">Make video</button>
      </div>
    </header>
    <div class="tabs"><button data-tab="board" class="on">Storyboard</button><button data-tab="narrator">Narrator</button><button data-tab="video">Video</button></div>
    <div id="p-plan-source" class="muted"></div>
    <details id="p-plan" class="hidden"><summary>Saved cast and scene treatments (JSON)</summary><label>Cast<textarea id="plan-cast"></textarea></label><label>Scene treatments<textarea id="plan-scenes"></textarea></label><label>Style configuration<textarea id="plan-style"></textarea></label></details>
    <div id="tab-board">
      <div class="board-bar"><button id="p-undo" disabled>Undo</button><button id="p-redo" disabled>Redo</button><button id="p-versions">Versions</button><button id="p-rename">Rename</button><button id="p-duplicate">Duplicate</button><button id="p-trash">Trash</button><span id="dirty" class="muted" role="status" aria-live="polite"></span><button id="p-save" class="primary small" disabled>Save changes</button></div>
      <div id="board"></div>
    </div>
    <div id="tab-narrator" class="hidden"></div>
    <div id="tab-video" class="hidden"></div>
  </section>
</template>

<div id="modal" class="modal hidden"><div class="modal-box" role="dialog" aria-modal="true"><button class="close" aria-label="Close">×</button><div id="modal-body"></div></div></div>
<div id="progress" class="modal hidden"><div class="modal-box progress-box">
  <button id="prog-cancel" class="small">Cancel</button><div id="prog-title">Working…</div><div class="bar"><div id="prog-fill"></div></div><div id="prog-stage" class="muted"></div>
</div></div>
<div id="toast" class="hidden"></div>
</body>
</html>
